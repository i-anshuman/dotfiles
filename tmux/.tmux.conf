# ~/.tmux.conf
unbind r
bind r source-file ~/.tmux.conf \; display "Configuration Reloaded!"

# Tmux keybinding prefix (alt + x)
set -g prefix M-x

# Options to make tmux more pleasant
set -g mouse on
set -g default-terminal "tmux-256color"

# Make tmux more intuitive
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Configure horizontal and vertical splitting
bind-key "|" split-window -h -c "#{pane_current_path}"
bind-key "\\" split-window -fh -c "#{pane_current_path}"
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "_" split-window -fv -c "#{pane_current_path}"

# Jump to marked pane
bind \` switch-client -t'{marked}'

# Bind the current path
bind c new-window -c "#{pane_current_path}"

# Open quick notes in a new window
bind-key h split-window -h "vim ~/notes/notes.md"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha" # latte, frappe, macchiato, or mocha
set -g @catppuccin_window_status_style "rounded" # basic, rounded, slanted, custom, or none
set -g @catppuccin_window_text " #W"

# Run catppuccin script
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -agF status-right "#{prefix_highlight}"

# Run TPM
run '~/.tmux/plugins/tpm/tpm'
